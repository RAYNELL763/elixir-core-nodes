name: Elixir BEAM Engine Pipeline

on:
  schedule:
    # Wakes up at 22 minutes past 2 AM, 8 AM, 2 PM, and 8 PM UTC
    # (10:22 AM, 4:22 PM, 10:22 PM, and 4:22 AM Singapore Time)
    - cron: '22 2,8,14,20 * * *'
  workflow_dispatch:

jobs:
  elixir-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Core Repository
        uses: actions/checkout@v4

      - name: Mutate Elixir Struct Spec
        run: |
          # 30% chance to skip (maintains natural execution gaps)
          if [ $((RANDOM % 100)) -lt 30 ]; then
            echo "Elixir module specs current. Skipping execution."
            exit 0
          fi

          mkdir -p lib
          TARGET_FILE="lib/telemetry_node.ex"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "defmodule TelemetryNode do" > "$TARGET_FILE"
            echo "  @moduledoc \"\"\"" >> "$TARGET_FILE"
            echo "  Core Distributed Node State Definitions" >> "$TARGET_FILE"
            echo "  \"\"\"" >> "$TARGET_FILE"
            echo "end" >> "$TARGET_FILE"
          fi

          COMPONENTS=("BufferState" "MetricVector" "SessionContext" "CacheEntry" "NodePayload")
          PICKED_COMP=${COMPONENTS[$RANDOM % ${#COMPONENTS[@]}]}

          # Insert defstruct before final 'end'
          sed -i "$ i\\  defmodule ${PICKED_COMP}_$RANDOM do\\n    defstruct id: $RANDOM, active: true\\n  end\\n" "$TARGET_FILE"

          git config --global user.name "RAYNELL763"
          git config --global user.email "raynell763@gmail.com"

          MESSAGES=(
            "feat: add Elixir struct definition for BEAM state node"
            "refactor: optimize module struct fields in telemetry_node.ex"
            "fix: adjust default struct keys in Elixir module schema"
            "chore: sync Mix project module specifications"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add lib/
          git commit -m "$MSG"
          git push
